services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - frontend_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
     
      # Cloudinary is optional; uncomment these and set the values in .env to enable image uploads.
      # CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      # CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      # CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - frontend_network
      - database_network
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    expose:
      - "27017"
    networks:
      - database_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  frontend_network:
  database_network:
    internal: true
